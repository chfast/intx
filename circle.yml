version: 2.1
orbs:
  codecov: codecov/codecov@6.1.0
  win: circleci/windows@5.0

executors:
  linux-gcc-latest:
    docker:
      - image: ethereum/cpp-build-env:24-gcc-14
  linux-clang-latest:
    docker:
      - image: ethereum/cpp-build-env:24-clang-20
  macos:
    resource_class: m4pro.medium
    macos:
      xcode: 26.5
  macos-xcode-min:
    resource_class: m4pro.medium
    macos:
      xcode: 16.4.0

commands:
  install_cmake:
    parameters:
      version:
        type: string
    steps:
      - run:
          name: "Install CMake <<parameters.version>>"
          working_directory: /usr/local
          command: |
            curl -L https://github.com/Kitware/CMake/releases/download/v<<parameters.version>>/cmake-<<parameters.version>>-linux-x86_64.tar.gz | sudo tar -xz --strip=1

  install_deps:
    description: "Install dependencies"
    steps:
      - run:
          name: "Install dependencies"
          command: |
            sudo apt -q update
            sudo apt install -qy libgmp-dev

  install_powerpc64:
    steps:
      - run:
          name: "Install powerpc64 toolchain"
          command: |
            sudo apt -q update
            sudo apt -qy install g++-powerpc64-linux-gnu

  check_code_format:
    steps:
      - run:
          name: "Check code format"
          command: |
            clang-format --version
            git ls-files '*.hpp' '*.cpp' '*.h' '*.c' | xargs clang-format -i
            git diff --color --exit-code

  build_and_test:
    description: "Build & Test"
    steps:
      - run:
          name: "Environment"
          command: |
            CC=${CC:-cc}
            CXX=${CXX:-cpp}
            echo CC: $CC
            echo CXX: $CXX
            $CC --version
            $CXX --version
            cmake --version
            # In Docker, nproc reports the CPUs of the host, not the CPU limit of the container.
            if [ -r /sys/fs/cgroup/cpu.max ]; then
              JOBS=$(awk '$1 != "max" { print int($1 / $2) }' /sys/fs/cgroup/cpu.max)
            fi
            JOBS=${JOBS:-$(getconf _NPROCESSORS_ONLN)}
            echo "Build jobs: $JOBS"
            echo "export CMAKE_BUILD_PARALLEL_LEVEL=$JOBS CTEST_PARALLEL_LEVEL=$JOBS HUNTER_JOBS_NUMBER=$JOBS" >> "$BASH_ENV"
      - checkout
      - run:
          name: "Configure"
          command: cmake -B ~/build -DCMAKE_COMPILE_WARNING_AS_ERROR=TRUE -DCMAKE_INSTALL_PREFIX=~/install -DCMAKE_BUILD_TYPE=$BUILD_TYPE $CMAKE_OPTIONS
      - run:
          name: "Build"
          command: |
            cmake --build ~/build
            cmake --build ~/build --target package
      - run:
          name: "Test"
          working_directory: ~/build
          command: |
            ctest --output-on-failure --schedule-random -R ${TESTS_FILTER:-'.*'}
      - run:
          name: "Install"
          command: cmake --build ~/build --target install

  windows_build_and_test:
    description: "Build & Test with MSVC on Windows"
    parameters:
      arch:
        type: string
      build_type:
        type: string
    steps:
      - checkout
      - run:
          name: "Setup environment (bash)"
          shell: bash
          command: |
            echo 'export PATH=$PATH:"/c/Program Files/Microsoft Visual Studio/2022/Community/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin"' >> $BASH_ENV
      - run:
          name: 'Configure'
          shell: powershell
          command: |
            $ErrorActionPreference = "Stop"
            & 'C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\Launch-VsDevShell.ps1' -Arch <<parameters.arch>>
            cmake --version
            cmake -S . -B ~/build -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=TRUE -DCMAKE_INSTALL_PREFIX=C:\install -DCMAKE_BUILD_TYPE=<<parameters.build_type>> -DHUNTER_CONFIGURATION_TYPES=<<parameters.build_type>> -DINTX_BENCHMARKING=OFF
      - run:
          name: 'Build'
          shell: powershell
          command: |
            $ErrorActionPreference = "Stop"
            & 'C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\Launch-VsDevShell.ps1' -Arch <<parameters.arch>>
            cmake --build ~/build
      - run:
          name: 'Test'
          shell: powershell
          working_directory: ~/build
          command: |
            $ErrorActionPreference = "Stop"
            & 'C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\Launch-VsDevShell.ps1' -Arch <<parameters.arch>>
            ctest -j4 --output-on-failure --schedule-random

  benchmark:
    description: "Benchmark"
    steps:
      - run:
          name: "Benchmark"
          working_directory: ~/build
          command: test/intx-bench --benchmark_min_time=1x

  collect_coverage_gcc:
    description: "Collect coverage data (GCC)"
    steps:
      - run:
          name: "Collect coverage data (GCC)"
          working_directory: ~/build
          # Use coveralls to eliminate branch stats (they need more work)
          command: |
            mkdir -p ~/coverage
            gcovr --filter ~/project --coveralls coverage.json --html ~/coverage/coverage.html --html-nested ~/coverage/coverage.html
      - store_artifacts:
          path: ~/coverage
          destination: coverage

  collect_coverage_clang:
    description: "Collect coverage data (clang)"
    steps:
      - run:
          name: "Collect coverage data (clang)"
          working_directory: ~/build
          command: |
            ARGS="test/intx-unittests -Xdemangler llvm-cxxfilt -instr-profile=intx.profdata"

            mkdir ~/coverage
            llvm-profdata merge -sparse *.profraw -o intx.profdata

            llvm-cov export -format=lcov $ARGS -skip-expansions -skip-branches > ~/coverage/coverage.lcov

            llvm-cov show $ARGS -format=html -show-directory-coverage -show-line-counts-or-regions -o ~/coverage/html

            llvm-cov report $ARGS > ~/coverage/report.txt
            llvm-cov report $ARGS -use-color
      - store_artifacts:
          path: ~/coverage
          destination: coverage

  upload_coverage:
    description: "Upload coverage data"
    parameters:
      flags:
        type: string
    steps:
      - codecov/upload:
          plugins: noop
          disable_search: true
          files: ../build/coverage.json,../coverage/coverage.lcov
          flags: <<parameters.flags>>

  fuzz:
    description: "Fuzz with the cached corpus"
    parameters:
      arch:
        type: string
    steps:
      - restore_cache:
          name: "Restore fuzzing corpus"
          key: corpus-<<parameters.arch>>
      - run:
          name: "Fuzzing"
          working_directory: ~/build
          command: |
            # The -fork parent exits without freeing its list of worker threads.
            echo leak:fuzzer::FuzzWithFork > ~/lsan.supp
            LSAN_OPTIONS=suppressions=$HOME/lsan.supp \
            test/intx-fuzzer ~/corpus -create_missing_dirs=1 -fork=$CTEST_PARALLEL_LEVEL -use_value_profile=1 -max_len=4096 -entropic_scale_per_exec_time=1 -max_total_time=300 2>&1 | sed '/NEW_FUNC/d'
      - run:
          name: "Minimize fuzzing corpus"
          working_directory: ~/build
          command: |
            test/intx-fuzzer -merge=1 -create_missing_dirs=1 -use_value_profile=1 -max_len=4096 ~/corpus-min ~/corpus
            rm -rf ~/corpus
            mv ~/corpus-min ~/corpus
      - save_cache:
          name: "Save fuzzing corpus"
          key: corpus-<<parameters.arch>>-{{ epoch }}
          paths:
            - ~/corpus
      - run:
          name: "Archive fuzzing corpus"
          command: tar -czf ~/corpus-<<parameters.arch>>.tar.gz -C ~ --transform='s,^corpus,corpus-<<parameters.arch>>,' corpus
      - store_artifacts:
          path: ~/corpus-<<parameters.arch>>.tar.gz
          destination: corpus-<<parameters.arch>>.tar.gz


jobs:

  lint:
    docker:
      - image: ethereum/cpp-build-env:24-lint
    steps:
      - checkout
      - check_code_format

  build-minimal:
    executor: linux-gcc-latest
    steps:
      - checkout
      - run:
          name: "Build package"
          command: |
            cmake -B ~/build -DCMAKE_COMPILE_WARNING_AS_ERROR=TRUE -DINTX_TESTING=OFF
            cmake --build ~/build --target package
      - run:
          name: "Inspect package"
          command: tar tvf ~/build/intx*.tar.gz
      - run:
          name: "Install conan"
          command: |
            sudo pip install --break-system-packages conan
            conan profile detect
      - run:
          name: "Build conan package"
          command: conan create . -s:a=compiler.cppstd=20

  linux-gcc-coverage:
    environment:
      BUILD_TYPE: Coverage
      TESTS_FILTER: unittests
    executor: linux-gcc-latest
    steps:
      - install_deps
      - build_and_test
      - collect_coverage_gcc
      - upload_coverage:
          flags: gcc
      - run:
          name: "Collect coverage data for SonarQube Cloud"
          working_directory: ~/build
          # The failing side of the assertions cannot be covered: exclude their branches.
          command: |
            mkdir -p ~/sonar
            gcovr --filter ~/project --exclude-branches-by-pattern '.*(INTX_REQUIRE|assert)\(.*' --sonarqube ~/sonar/coverage.xml
      - persist_to_workspace:
          root: ~/sonar
          paths:
            - coverage.xml

  linux-clang-coverage:
    environment:
      BUILD_TYPE: Coverage
      TESTS_FILTER: unittests
    executor: linux-clang-latest
    steps:
      - install_deps
      - build_and_test
      - collect_coverage_clang


  linux-clang-sanitizers:
    environment:
      BUILD_TYPE: RelWithDebInfo
      # Strict C++20 (no GNU extensions): with libstdc++ before 16 __int128 is not an integral type.
      CMAKE_OPTIONS: -DINTX_ASSERTIONS=ON -DSANITIZE=address,undefined,implicit-conversion,nullability -DCMAKE_CXX_CLANG_TIDY=clang-tidy -DCMAKE_CXX_EXTENSIONS=OFF
      # Uninitialized locals get a garbage pattern, so reading one changes the result.
      CXXFLAGS: -ftrivial-auto-var-init=pattern
      UBSAN_OPTIONS: halt_on_error=1
    executor: linux-clang-latest
    resource_class: large
    steps:
      - install_deps
      - build_and_test
      - benchmark

  linux-gcc-sanitizers:
    environment:
      BUILD_TYPE: RelWithDebInfo
      CMAKE_OPTIONS: -DINTX_ASSERTIONS=ON -DSANITIZE=address,pointer-compare,pointer-subtract,leak,undefined
      # _GLIBCXX_ASSERTIONS checks the bounds of std::span and std::array, also inside an object.
      # Uninitialized locals get a garbage pattern, so reading one changes the result.
      CXXFLAGS: -D_GLIBCXX_ASSERTIONS -ftrivial-auto-var-init=pattern
      ASAN_OPTIONS: detect_invalid_pointer_pairs=2
      UBSAN_OPTIONS: halt_on_error=1
    executor: linux-gcc-latest
    steps:
      - install_deps
      - build_and_test
      - benchmark

  powerpc64:
    environment:
      BUILD_TYPE: Release
      CMAKE_OPTIONS: -DCMAKE_TOOLCHAIN_FILE=~/project/cmake/toolchains/powerpc64.cmake -DINTX_BENCHMARKING=OFF
    executor: linux-gcc-latest
    steps:
      - install_powerpc64
      - build_and_test

  arm64:
    environment:
      BUILD_TYPE: Release
    machine:
      image: ubuntu-2604:2026.10.1
      resource_class: arm.medium
    steps:
      - build_and_test

  no-exceptions:
    environment:
      BUILD_TYPE: Release
      CMAKE_OPTIONS: -DEXCEPTIONS=OFF -DRTTI=OFF
    executor: linux-gcc-latest
    steps:
      - install_deps
      - build_and_test
      - benchmark

  linux-32bit:
    environment:
      BUILD_TYPE: Release
      CMAKE_OPTIONS: -DCMAKE_TOOLCHAIN_FILE=~/project/cmake/toolchains/32bit.cmake -DINTX_BENCHMARKING=OFF
    docker:
      - image: ethereum/cpp-build-env:24-gcc-14-multilib
    steps:
      - build_and_test

  linux-32bit-coverage:
    environment:
      BUILD_TYPE: Coverage
      CMAKE_OPTIONS: -DCMAKE_TOOLCHAIN_FILE=~/project/cmake/toolchains/32bit.cmake -DINTX_BENCHMARKING=OFF
      TESTS_FILTER: unittests
    docker:
      - image: ethereum/cpp-build-env:24-gcc-14-multilib
    steps:
      - build_and_test
      - collect_coverage_gcc
      - upload_coverage:
          flags: 32bit

  fuzzing:
    environment:
      - BUILD_TYPE: Release
      - CMAKE_OPTIONS: -DINTX_FUZZING=ON -DINTX_ASSERTIONS=ON
    executor: linux-clang-latest
    steps:
      - install_deps
      - build_and_test
      - benchmark
      - fuzz:
          arch: amd64

  fuzzing-arm64:
    environment:
      BUILD_TYPE: Release
      CMAKE_OPTIONS: -DINTX_FUZZING=ON -DINTX_ASSERTIONS=ON -DINTX_BENCHMARKING=OFF
      CC: clang-22
      CXX: clang++-22
    machine:
      image: ubuntu-2604:2026.10.1
      resource_class: arm.medium
    steps:
      - run:
          name: "Install dependencies"
          command: |
            sudo apt -q update
            sudo apt install -qy clang-22 libclang-rt-22-dev libgmp-dev
      - build_and_test
      - fuzz:
          arch: arm64

  fuzzing-32bit:
    environment:
      BUILD_TYPE: Release
      CMAKE_OPTIONS: -DCMAKE_TOOLCHAIN_FILE=~/project/cmake/toolchains/32bit.cmake -DINTX_FUZZING=ON -DINTX_ASSERTIONS=ON -DINTX_BENCHMARKING=OFF
      CC: clang-22
      CXX: clang++-22
    machine:
      image: ubuntu-2604:2026.10.1
    steps:
      - run:
          name: "Install dependencies"
          command: |
            sudo dpkg --add-architecture i386
            sudo apt -q update
            sudo apt install -qy clang-22 libclang-rt-22-dev g++-multilib libgmp-dev:i386
      - build_and_test
      - fuzz:
          arch: i386

  macos:
    environment:
      BUILD_TYPE: Release
    executor: macos
    steps:
      - run:
          name: "Install deps"
          command: |
            HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake gmp
      - build_and_test
      - benchmark

  macos-coverage:
    environment:
      BUILD_TYPE: Coverage
      TESTS_FILTER: unittests
    # The codecov orb installs gpg with Homebrew, which fails on the macOS 26 image of Xcode 26:
    # https://github.com/codecov/codecov-circleci-orb/issues/268
    executor: macos-xcode-min
    steps:
      - run:
          name: "Install deps"
          command: |
            HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake gmp
      - build_and_test
      - run:
          name: "Use the LLVM tools of Xcode"
          command: |
            echo "export PATH=\"$(dirname "$(xcrun -f llvm-cov)"):\$PATH\"" >> "$BASH_ENV"
      - collect_coverage_clang
      - upload_coverage:
          flags: macos

  windows-32bit:
    executor: win/server-2022
    steps:
      - windows_build_and_test:
          arch: x86
          build_type: Release

  windows-debug:
    executor: win/server-2022
    steps:
      - windows_build_and_test:
          arch: amd64
          build_type: Debug

  windows-release:
    executor: win/server-2022
    steps:
      - windows_build_and_test:
          arch: amd64
          build_type: Release

  cmake-min:
    docker:
      - image: cimg/base:current-24.04
    steps:
      - install_cmake:
          version: 3.16.3
      - install_deps
      - build_and_test

  sonarcloud:
    environment:
      SONAR_SCANNER_VERSION: 8.4.0.16527
    executor: linux-clang-latest
    resource_class: large  # 4 CPUs: the analysis runs one compilation unit per CPU.
    steps:
      - run:
          name: "Check the SonarQube Cloud token"
          command: |
            # Pull requests from forks do not get the token.
            if [ -z "$SONAR_TOKEN" ]; then
              echo "SONAR_TOKEN is not set: skipping the analysis"
              circleci-agent step halt
            fi
      - checkout:
          method: full
      - attach_workspace:
          at: ~/sonar
      - run:
          name: "Install dependencies"
          command: |
            sudo apt -q update
            sudo apt install -qy libgmp-dev unzip
      - run:
          name: "Install SonarScanner"
          working_directory: ~/
          command: |
            curl -sSL -o sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip
            unzip -q sonar-scanner.zip
            mv sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64 sonar-scanner
      - run:
          name: "Configure"
          # The compilation database gives the analysis the compiler options, e.g. the C++ standard.
          command: cmake -B ~/build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DINTX_FUZZING=ON
      - run:
          name: "Analyze"
          command: |
            # test/integration has the Conan test package, which the Python analysis takes for tests.
            ~/sonar-scanner/bin/sonar-scanner \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.organization=chfast \
              -Dsonar.projectKey=chfast_intx \
              '-Dsonar.exclusions=test/integration/**,lean/**' \
              -Dsonar.cfamily.compile-commands=$HOME/build/compile_commands.json \
              -Dsonar.coverageReportPaths=$HOME/sonar/coverage.xml \
              '-Dsonar.coverage.exclusions=test/**,examples/**,conanfile.py' \
              -Dsonar.python.version=3

  lean:
    docker:
      - image: ubuntu:26.04
    resource_class: large
    environment:
      ELAN_VERSION: v4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - run:
          name: "Install tools"
          command: |
            apt-get update -q
            DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
              ca-certificates curl git clang lld g++-riscv64-linux-gnu python3
      - checkout
      - run:
          name: "Install Lean"
          command: |
            curl -sSfL -o /tmp/elan.tar.gz https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz
            echo "$ELAN_SHA256  /tmp/elan.tar.gz" | sha256sum -c
            tar xzf /tmp/elan.tar.gz -C /tmp
            /tmp/elan-init -y --default-toolchain none
            echo 'export PATH=$HOME/.elan/bin:$PATH' >> $BASH_ENV
      - restore_cache:
          keys:
            - lean-{{ checksum "lean/lean-toolchain" }}-{{ checksum "lean/lake-manifest.json" }}
      - run:
          name: "Get the Mathlib build"
          working_directory: lean
          command: lake exe cache get
      - run:
          name: "Generate the RV64 machine code and the specifications"
          working_directory: lean
          command: CXX=clang++ scripts/rv_build.sh
      # The proofs of the decoding of the words of the machine code take most of the build: a new
      # word rebuilds only its file of Gen/Decode/, and Lake compares the hashes of the sources.
      - restore_cache:
          keys:
            - lean-decode-{{ checksum "lean/lean-toolchain" }}-{{ checksum "lean/lake-manifest.json" }}-
      - run:
          name: "Check the proofs and their axioms"
          working_directory: lean
          no_output_timeout: 60m
          # Docker reports the CPUs of the host: 3 Lean processes fit in the 8 GB of the job, but
          # not with the proofs that take 3-5 GB each, which build one at a time. The build of the
          # decode files of an earlier layout is deleted, so that the cache does not keep it. The
          # timeout leaves the time to save the decode files built, within the hour of the job.
          command: |
            for f in .lake/build/lib/lean/IntxRV/Gen/Decode/* .lake/build/ir/IntxRV/Gen/Decode/*; do
              b=$(basename "$f")
              [ -e "IntxRV/Gen/Decode/${b%%.*}.lean" ] || rm -f "$f"
            done
            timeout 45m sh -ec '
              LEAN_NUM_THREADS=3 lake build IntxRV.Gen.Code
              LEAN_NUM_THREADS=1 lake build IntxRV.Api.mul_256 IntxRV.Api.umul_256 \
                IntxRV.Api.udivrem_by1 IntxRV.Api.udivrem_by2
              LEAN_NUM_THREADS=3 lake build Intx IntxRV Checks'
      - save_cache:
          key: lean-decode-{{ checksum "lean/lean-toolchain" }}-{{ checksum "lean/lake-manifest.json" }}-{{ epoch }}
          paths:
            - lean/.lake/build/lib/lean/IntxRV/Gen/Decode
            - lean/.lake/build/ir/IntxRV/Gen/Decode
          when: always
      - run:
          name: "Check the hashes of the modeled C++ code"
          working_directory: lean
          command: scripts/check-source.py
      - save_cache:
          key: lean-{{ checksum "lean/lean-toolchain" }}-{{ checksum "lean/lake-manifest.json" }}
          paths:
            - lean/.lake/packages
          when: always

workflows:
  version: 2
  intx:
    jobs:
      - lint
      - build-minimal
      - linux-gcc-coverage
      - linux-clang-coverage
      - linux-clang-sanitizers
      - linux-gcc-sanitizers
      - no-exceptions
      - linux-32bit
      - linux-32bit-coverage
      - fuzzing
      - fuzzing-arm64
      - fuzzing-32bit
      - macos
      - macos-coverage
      - cmake-min
      - lean
      - arm64
      - powerpc64
      - windows-32bit
      - windows-debug
      - windows-release
      - sonarcloud:
          requires:
            - linux-gcc-coverage
