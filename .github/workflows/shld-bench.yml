name: shld-bench

on:
  push:
    branches: [shld-bench]
  workflow_dispatch:

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15-intel]
        rep: [1, 2, 3, 4]
        include:
          - {os: ubuntu-24.04-arm, rep: 1}
          - {os: macos-15, rep: 1}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get -q update && sudo apt-get -qy install clang libgmp-dev ninja-build
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install gmp ninja
      - name: Benchmark
        env:
          CMAKE_GENERATOR: Ninja
        run: scripts/bench_shld.sh out "gha:${{ matrix.os }}#${{ matrix.rep }}"
      - uses: actions/upload-artifact@v4
        with:
          name: shld-${{ matrix.os }}-${{ matrix.rep }}
          path: out
